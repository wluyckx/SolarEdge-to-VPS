[project]
name = "sungrow-edge"
version = "0.1.0"
description = "Edge daemon for Sungrow-to-VPS solar telemetry"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded single-file HTML/CSS/JS asset — line length rules don't apply
"src/control_ui.py" = ["E501"]
