name: Sungrow Edge Daemon
version: "0.2.2"
slug: sungrow_edge
description: Poll Sungrow inverter via Modbus and upload telemetry to VPS
url: https://github.com/Wim/SolarEdge-to-VPS
startup: services
boot: auto
init: false
arch:
  - aarch64
  - amd64
  - armv7
map:
  - addon_config:rw
ports:
  8402/tcp: 8402
ports_description:
  8402/tcp: Battery control API (bearer-token auth)
options:
  sungrow_host: "192.168.1.100"
  vps_base_url: "https://your-domain.example.com"
  vps_device_token: "change-me"
  sungrow_port: 502
  sungrow_slave_id: 1
  poll_interval_s: 5
  inter_register_delay_ms: 20
  device_id: ""
  batch_size: 30
  upload_interval_s: 10
  spool_path: "/data/spool.db"
  raw_debug_enabled: false
  raw_debug_every_n_polls: 10
  mqtt_enabled: false
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery_prefix: "homeassistant"
  mqtt_base_topic: "sungrow_edge"
  control_enabled: false
  control_dry_run: true
  control_api_token: ""
  control_api_port: 8402
schema:
  sungrow_host: str
  vps_base_url: str
  vps_device_token: password
  sungrow_port: int
  sungrow_slave_id: int
  poll_interval_s: int
  inter_register_delay_ms: int
  device_id: str?
  batch_size: int
  upload_interval_s: int
  spool_path: str
  raw_debug_enabled: bool
  raw_debug_every_n_polls: int(1,)
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: int(1,65535)
  mqtt_username: str?
  mqtt_password: password?
  mqtt_discovery_prefix: str
  mqtt_base_topic: str
  control_enabled: bool
  control_dry_run: bool
  control_api_token: password?
  control_api_port: int(1,65535)
